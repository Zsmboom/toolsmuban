name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'saas-tanstack/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'saas-tanstack/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-tanstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: saas-tanstack/package-lock.json

      - run: npm ci

      - name: Security audit
        run: npm run audit

      - name: Check Cloudflare binding types
        run: npm run types:cf

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test


  deploy:
    # 只有校验通过才部署，且 PR 不部署
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-tanstack

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: saas-tanstack/package-lock.json

      - run: npm ci

      # 库落后于迁移文件就不许部署。
      # 2026-06 那次线上故障（admin_audit_logs / users 三列从未应用）就是因为
      # 部署前没有任何一步检查过「库和代码是否对得上」。
      - name: Check pending DB migrations
        run: npm run db:check
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      # 这些是非机密的构建期变量（商品/价格 ID、站点地址），
      # 会被内联进产物，供服务端和浏览器端共用。
      # 真正的机密走 `wrangler secret put`，不在这里出现。
      - name: Build
        run: npm run build:cf
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_PAYMENT_PROVIDERS: ${{ vars.VITE_PAYMENT_PROVIDERS || 'stripe' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_BASIC_PRICE_ID: ${{ vars.VITE_STRIPE_BASIC_PRICE_ID }}
          VITE_STRIPE_PRO_PRICE_ID: ${{ vars.VITE_STRIPE_PRO_PRICE_ID }}
          VITE_STRIPE_ENTERPRISE_PRICE_ID: ${{ vars.VITE_STRIPE_ENTERPRISE_PRICE_ID }}
          VITE_CREEM_PRODUCT_BASIC: ${{ vars.VITE_CREEM_PRODUCT_BASIC }}
          VITE_CREEM_PRODUCT_PRO: ${{ vars.VITE_CREEM_PRODUCT_PRO }}
          VITE_CREEM_PRODUCT_ENTERPRISE: ${{ vars.VITE_CREEM_PRODUCT_ENTERPRISE }}
          VITE_PAYPAL_PLAN_BASIC: ${{ vars.VITE_PAYPAL_PLAN_BASIC }}
          VITE_PAYPAL_PLAN_PRO: ${{ vars.VITE_PAYPAL_PLAN_PRO }}
          VITE_PAYPAL_PLAN_ENTERPRISE: ${{ vars.VITE_PAYPAL_PLAN_ENTERPRISE }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: saas-tanstack
